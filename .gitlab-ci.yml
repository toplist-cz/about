#
# Before using this .gitlab-ci.yml:
#
# - This example uses the latest Docker image, but you might want to use the
#   exact version to avoid any broken pipelines.
#   All available Hugo versions are listed under https://gitlab.com/pages/hugo/container_registry.
# - Read about the difference between hugo and hugo_extended
#   https://gitlab.com/pages/hugo/-/blob/main/README.md#hugo-vs-hugo_extended.
# - To change the theme, see
#   https://gitlab.com/pages/hugo/-/blob/main/README.md#use-a-custom-theme.
#
image: debian:stable

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  HUGO_ENV: production
  HUGO_VERSION: 0.125.7
  THEME_URL: "github.com/thegeeklab/hugo-geekdoc"
  # keep the Go module cache inside the project dir so it can be cached by the runner
  GOMODCACHE: $CI_PROJECT_DIR/.go-modcache

stages:
  - build
  - deploy

default:
  before_script:
    - ln -fs /usr/share/zoneinfo/Europe/Prague /etc/localtime
    - apt-get update -qq && apt-get install -y -qq git golang-go curl rsync openssh-client openssl
    ## Uncomment the following if you use PostCSS. See https://gohugo.io/hugo-pipes/postcss/
    #- npm install postcss postcss-cli autoprefixer

build:
  stage: build
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go-modcache
  script:
    - curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
    - dpkg -i hugo.deb
    - rm -f hugo.deb
    - git submodule update --init --recursive
    - hugo
  artifacts:
    paths:
      - public

deploy:
  tags:
    - kvm
  stage: deploy
  needs:
    - build
  script:
    - eval $(ssh-agent -s)
    - echo "${DEPLOY_KEY}" | openssl base64 -A -d | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan 10.183.148.183 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - rsync -rav --delete-after --min-size=1 ./public/ gitlab@10.183.148.183:www/t
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
